name: Application Tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            node: '22.12'
          - php: '8.5'
            node: '24'

    name: PHP ${{ matrix.php }} / Node ${{ matrix.node }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Patch Pest browser shutdown
        shell: bash
        run: |
          # Remove after https://github.com/pestphp/pest/issues/1754 is fixed upstream.
          php <<'PHP'
          <?php

          $path = 'vendor/pestphp/pest-plugin-browser/src/ServerManager.php';
          $contents = file_get_contents($path);
          $search = "            '.'.DIRECTORY_SEPARATOR.'node_modules'";
          $replacement = "            'exec .'.DIRECTORY_SEPARATOR.'node_modules'";

          if (substr_count($contents, $search) !== 1) {
              fwrite(STDERR, "Unable to apply the Pest browser shutdown patch.\n");
              exit(1);
          }

          file_put_contents($path, str_replace($search, $replacement, $contents));
          PHP

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Verify application
        run: composer verify
